[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integrum"
version = "0.1.0"
description = "Convert any Python module or library into an MCP server with FastMCP and stateful word-based object management."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AlphaDeep" },
]
keywords = ["mcp", "fastmcp", "llm", "tools", "reflection", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.0.0",
    "docstring-parser>=0.16",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/alphadeepai/integrum"
Repository = "https://github.com/alphadeepai/integrum"
Issues = "https://github.com/alphadeepai/integrum/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "scikit-learn>=1.4.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.scripts]
integrum = "integrum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/integrum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
